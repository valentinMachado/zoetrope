[project]
name = "zoetrope"
version = "0.1.0"
description = "Local image-to-video tool: a still image and a prompt in, a video out."
# The worker runs this package inside Wan2GP's venv (Python 3.10); keep the code 3.10-compatible.
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "pillow>=10",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zoetrope"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: FastAPI declares File() / Form() / Depends() in argument defaults by design.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["zoetrope", "conftest"]
